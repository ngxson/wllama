name: Publish (npm staged)

# Stage the packages on npm. Approve them on npmjs.com ("Staged Packages" tab) or with `npm stage approve <stage-id>`
# The same version cannot be staged twice and CI cannot reject it, so this runs only on version bump
# To restage a version: reject it on npmjs.com, then run this workflow manually
# Setup: add this workflow as trusted publisher (stage publish only) on both @wllama/wllama and @wllama/wllama-compat

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest

    if: github.repository == 'ngxson/wllama'

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          # full history, build_worker.sh counts llama.cpp commits for LIBLLAMA_VERSION
          fetch-depth: 0
          persist-credentials: false

      # no cache on purpose, other workflows can write to it
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        # npm stage needs npm >= 11.15
        run: |
          npm install -g npm@11
          npm --version

      - name: Check which versions are already published
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> $GITHUB_OUTPUT
          any=false
          for pkg in @wllama/wllama @wllama/wllama-compat; do
            key="$(echo "$pkg" | sed 's#.*/##; s#-#_#g')"
            if [ -n "$(npm view "$pkg@$version" version 2>/dev/null)" ]; then
              echo "$pkg@$version is already published, skipping it"
              echo "$key=false" >> $GITHUB_OUTPUT
            else
              echo "$key=true" >> $GITHUB_OUTPUT
              any=true
            fi
          done
          echo "any=$any" >> $GITHUB_OUTPUT

      - name: Build wasm
        if: steps.check.outputs.any == 'true'
        run: ./scripts/build_wasm.sh

      - name: Install
        if: steps.check.outputs.any == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.any == 'true'
        run: npm run build

      - name: Check package
        if: steps.check.outputs.any == 'true'
        run: node scripts/check_package_size.js

      - name: Stage on npm
        if: steps.check.outputs.any == 'true'
        env:
          STAGE_MAIN: ${{ steps.check.outputs.wllama }}
          STAGE_COMPAT: ${{ steps.check.outputs.wllama_compat }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          {
            echo "## npm staged publish: v$VERSION"
            echo
          } >> $GITHUB_STEP_SUMMARY

          stage() {
            local dir="$1" name="$2"
            local out status=0
            out="$(cd "$dir" && npm stage publish --access public --provenance 2>&1)" || status=$?
            echo "$out"
            if [ "$status" -eq 0 ]; then
              {
                echo "### $name@$VERSION staged"
                echo '```'
                echo "$out"
                echo '```'
                echo "Approve on https://www.npmjs.com/package/$name (Staged Packages tab) or with \`npm stage approve <stage-id>\`"
                echo
              } >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            # version is already staged
            if echo "$out" | grep -qiE 'E409|409 Conflict|EPUBLISHCONFLICT|cannot publish over|already exists'; then
              local msg="$name@$VERSION is already staged. To replace it, reject the staged version on npmjs.com, then re-run this workflow."
              echo "::warning::$msg"
              echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
              echo "> $msg" >> $GITHUB_STEP_SUMMARY
              echo >> $GITHUB_STEP_SUMMARY
              return 0
            fi
            return "$status"
          }

          if [ "$STAGE_MAIN" = "true" ]; then stage . @wllama/wllama; fi
          if [ "$STAGE_COMPAT" = "true" ]; then stage compat @wllama/wllama-compat; fi
