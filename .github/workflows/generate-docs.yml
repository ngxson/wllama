name: Build docs and demo

on:
  # Runs on pushes and PRs
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Get llama.cpp commit
        id: llamacpp
        run: echo "sha=$(git rev-parse HEAD:llama.cpp)" >> $GITHUB_OUTPUT

      - name: Cache wasm build directories
        uses: actions/cache@v4
        with:
          path: |
            build
            build-compat
          key: wasm-build-full-${{ runner.os }}-${{ steps.llamacpp.outputs.sha }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wasm-build-full-${{ runner.os }}-

      - name: Build wasm
        run: ./scripts/build_wasm.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Remove .gitignore and node_modules
        run: |
          rm .gitignore
          rm -rf node_modules

      - name: Build main example
        working-directory: ./examples/main
        run: |
          npm i
          npm run build
          rm .gitignore
          rm -rf node_modules

      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./"

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/master'
        uses: actions/deploy-pages@v4
