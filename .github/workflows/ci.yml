name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
    branches:
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  test:
    runs-on: ${{ matrix.os }}

    timeout-minutes: 20

    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [22]
        # include:
        #   - os: macos-14
        #     node_version: 22
        #   - os: windows-latest
        #     node_version: 22
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Check for debug build
        run: node scripts/check_debug_build.js

      - name: Get llama.cpp commit
        id: llamacpp
        run: echo "sha=$(git rev-parse HEAD:llama.cpp)" >> $GITHUB_OUTPUT

      - name: Cache wasm build directory
        uses: actions/cache@v4
        with:
          path: build
          key: wasm-build-${{ runner.os }}-${{ steps.llamacpp.outputs.sha }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wasm-build-${{ runner.os }}-

      # a fresh checkout makes all sources newer than the cached objects, so make rebuilds all; ccache makes it fast
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build wasm
        run: SKIP_COMPAT=1 ./scripts/build_wasm.sh

      - name: Set node version to ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install
        run: npm ci --include=dev

      - name: Install Playwright Dependencies
        run: npx playwright install --with-deps

      # run before "npm run build", as it regenerates the file to check
      - name: Check wasm version
        run: node scripts/check_wasm_version.js

      - name: Build
        run: npm run build

      - name: Test (Chrome)
        run: npm run test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READONLY }}

      - name: Test (Firefox)
        run: npm run test:firefox
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READONLY }}

  # compat build (asyncify, mem32): only src/wllama.test.ts on Chrome, runs in parallel with "test"
  test-compat:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          persist-credentials: false

      - name: Get llama.cpp commit
        id: llamacpp
        run: echo "sha=$(git rev-parse HEAD:llama.cpp)" >> $GITHUB_OUTPUT

      - name: Cache wasm build directory
        uses: actions/cache@v4
        with:
          path: build-compat
          key: wasm-build-compat-${{ runner.os }}-${{ steps.llamacpp.outputs.sha }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            wasm-build-compat-${{ runner.os }}-

      # the patched wasm-opt takes ~7 min to build (see scripts/build_wasm.sh)
      - name: Cache patched wasm-opt
        uses: actions/cache@v4
        with:
          path: scripts/.binaryen-cache
          key: binaryen-${{ runner.os }}-${{ hashFiles('scripts/binaryen-asyncify-try.patch', 'scripts/build_wasm.sh') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-compat-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-compat-${{ runner.os }}-

      - name: Build wasm (compat only)
        run: SKIP_MAIN=1 ./scripts/build_wasm.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci --include=dev

      - name: Install Playwright Dependencies
        run: npx playwright install --with-deps chromium

      - name: Test (Chrome, compat)
        run: npm run test:compat
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_READONLY }}

  # TODO: add test for WebGPU on github hosted runner ; current missing ShaderF16 support

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --include=dev

      - name: Check format
        run: |
          git config --global --add safe.directory $(realpath .)
          git status
          npm run format
          git status
          modified_files="$(git status -s)"
          echo "Modified files: ${modified_files}"
          if [ -n "${modified_files}" ]; then
            echo "Detect unformatted files"
            echo "You may need to run: npm run format"
            echo "${modified_files}"
            exit 1
          fi